name: CI

# Mirrors the local `land.ts` gate (build -> typecheck -> test across the workspace) so external PRs
# are verified automatically — `land.ts` only gates what core-dev lands, not contributor PRs.
on:
  push:
    branches: [main]
  pull_request:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Frozen lockfile = exact committed deps, so the surrealdb SDK stays pinned at 2.0.3
      # (a re-resolve would bump it and hang the e2e .connect()).
      - name: Install
        run: bun install --frozen-lockfile

      # Order matches land.ts: build first so typecheck/test run against fresh lib/, not stale output.
      - name: Build
        run: bun run --filter '*' build

      - name: Typecheck
        run: bun run --filter '*' typecheck

      # Postgres tests run on embedded PGlite (no service). SurrealDB live/parity tests skip gracefully
      # when no server is reachable — add a surrealdb service container later to exercise them in CI.
      - name: Test
        run: bun run --filter '*' test

  # Type-completeness + instantiation-budget suites (@ark/attest). SEPARATE job because attest runs
  # under node/tsx (not bun — see packages/core/docs/TYPE-PERF-TESTING.md) and its own TS program is
  # slower; kept out of the hot land gate. Runs off src/ via tsx, so no build step.
  type-perf:
    name: type-perf (attest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # node runs the attest suites; the pinned typescript devDep (not node) fixes instantiation counts.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # DRIVER suites import @schemic/core/* as a package — node/tsx resolves those via the node
      # condition (lib/), not the bun/src one — so core (and any cross-imported package) must be BUILT
      # first, or the suite throws ERR_MODULE_NOT_FOUND. (A package's OWN suite imports its src/ by
      # relative path and needs no build; the cross-package imports are what require it.)
      - name: Build
        run: bun run --filter '*' build

      - name: Type-perf suites
        run: bun run scripts/type-perf.ts
